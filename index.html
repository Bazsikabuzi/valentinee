<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
    body{
        background: linear-gradient(to right, #ffdde1, #ee9ca7);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family: Arial, sans-serif;
        text-align:center;
        overflow:hidden;
        position:relative;
    }

    h1{
        font-size:50px;
        color:white;
        z-index:2;
        position:relative;
    }

    .buttons{
        margin-top:30px;
        z-index:2;
        position:relative;
    }

    button{
        padding:15px 30px;
        font-size:22px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        margin:10px;
        transition:0.3s;
        position:absolute;
    }

    #yesBtn{
        background:#4CAF50;
        color:white;
        left:50%;
        transform:translateX(-50%);
    }

    #noBtn{
        background:#ff4d4d;
        color:white;
    }

    /* lebegő szívecskék */
    .heart{
        position:absolute;
        color:red;
        font-size:20px;
        animation: floatUp 5s linear infinite;
        user-select:none;
        pointer-events:none;
    }

    @keyframes floatUp{
        0% { transform: translateY(100vh) scale(0.5); opacity:0.5; }
        50% { opacity:1; }
        100% { transform: translateY(-50px) scale(1); opacity:0; }
    }
</style>
</head>

<body>

<!-- háttér zene -->
<audio id="bgMusic" loop>
    <source src="zene.mp3" type="audio/mpeg">
</audio>

<div>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
        <button id="yesBtn">YES 🥰</button>
        <button id="noBtn">NO 😢</button>
    </div>
</div>

<script>
let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let music = document.getElementById("bgMusic");
let size = 1;

// zene elindítása az első kattintásra (mobilbarát)
document.addEventListener("click", () => {
    music.play();
}, { once: true });

// NO gomb menekül a kurzor elől
document.addEventListener("mousemove", (e) => {
    let x = e.clientX;
    let y = e.clientY;
    let rect = noBtn.getBoundingClientRect();
    let offset = 50; // milyen messze meneküljön

    // ha a kurzor közel van a NO gombhoz, elmozdítjuk
    if(x > rect.left - offset && x < rect.right + offset &&
       y > rect.top - offset && y < rect.bottom + offset){
        let newX = Math.random() * (window.innerWidth - rect.width);
        let newY = Math.random() * (window.innerHeight - rect.height);
        noBtn.style.left = newX + "px";
        noBtn.style.top = newY + "px";
    }
});

// NO gomb → YES gomb nő
noBtn.addEventListener("click", function(){
    size += 0.35;
    yesBtn.style.transform = "translateX(-50%) scale(" + size + ")";
});

// YES gomb → végső üzenet
yesBtn.addEventListener("click", function(){
    document.body.innerHTML = `
        <h1 style="color:white;font-size:65px; z-index:2; position:relative;">
        YAAAAAY 💖💖💖<br>
        I LOVE YOU ❤️
        </h1>
    `;
});

// lebegő szívecskék generálása
function createHeart(){
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (10 + Math.random()*30) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}

// minden 400ms egy új szívecske
setInterval(createHeart, 400);

</script>

</body>
</html>
